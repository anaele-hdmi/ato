<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ツキノワ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --void: #06070d;
    --ink: #f6f1e8;
    --ink2: rgba(246, 241, 232, 0.68);
    --ink3: rgba(246, 241, 232, 0.4);
    --glass: rgba(15, 18, 33, 0.62);
    --glass2: rgba(15, 18, 33, 0.82);
    --line: rgba(246, 241, 232, 0.14);
    --coral: #ff7657;
    --sky: #5fc4ff;
    --mint: #63f0bf;
    --sun: #ffd37a;
    --rose: #ff5c8a;
    --pop: "Dela Gothic One", "Hiragino Kaku Gothic StdN", "Yu Gothic", sans-serif;
    --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--void);
    color: var(--ink);
    font-family: var(--body);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .lbl {
    position: absolute; left: 0; top: 0;
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; white-space: nowrap;
    color: var(--ink); text-shadow: 0 1px 6px rgba(0,0,0,.9);
    will-change: transform;
  }
  .lbl i { width: 9px; height: 9px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; flex: none; transform: translateX(-4.5px); }
  .lbl.body { font-family: var(--pop); font-weight: 400; font-size: 12px; letter-spacing: .08em; color: var(--ink2); }
  .lbl.body i { display: none; }
  .lbl.win { color: var(--sun); margin-top: 20px; }
  .lbl.win i { width: 14px; height: 14px; background: none; border: 3px solid currentColor; transform: translateX(-7px); animation: ping 1.1s ease-out infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(255,211,122,.7);} 100% { box-shadow: 0 0 0 14px rgba(255,211,122,0);} }

  .hud { position: fixed; left: 0; right: 0; pointer-events: none; padding-inline: 10px; }
  .hud > * { pointer-events: auto; }
  .card {
    background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 14px;
  }
  .top { top: 0; padding-top: calc(8px + env(safe-area-inset-top, 0px)); display: flex; gap: 6px; align-items: flex-start; }
  #obj { flex: 1 1 auto; min-width: 0; overflow: hidden; position: relative; }
  #objHead { width: 100%; display: flex; align-items: center; gap: 7px; padding: 7px 10px 2px; text-align: left; }
  .pill { font-family: var(--mono); font-size: 10px; padding: 1px 7px; border-radius: 99px; background: rgba(246,241,232,.1); color: var(--ink2); flex: none; }
  .pill.step { background: var(--coral); color: #1b0d08; font-weight: 700; }
  #objTitle { flex: 1; min-width: 0; font-family: var(--pop); font-size: 13.5px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #objHead .chev { flex: none; font-size: 10px; color: var(--ink3); transition: transform .2s; }
  #objHead[aria-expanded="true"] .chev { transform: rotate(180deg); }
  #next { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 2px 10px 8px; font-size: 12.5px; font-weight: 700; color: var(--ink); }
  #next.act #nextTxt { color: var(--sun); }
  #next.now { background: var(--sun); color: #1b1204; }
  #next.now #nextTxt { color: #1b1204; }
  #nextTxt { min-width: 0; }
  #cue { flex: none; font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--ink2); }
  #next.now #cue { color: #1b1204; }
  #more { padding: 0 10px 9px; border-top: 1px solid var(--line); }
  #objHint { margin: 7px 0 6px; font-size: 12px; line-height: 1.55; color: var(--ink2); }
  #tele { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 12px; font-family: var(--mono); font-size: 10.5px; line-height: 1.6; color: var(--ink2); font-variant-numeric: tabular-nums; }
  #tele b { color: var(--ink); font-weight: 500; float: right; }
  #fuelLine { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(246,241,232,.08); }
  #fuelLine span { display: block; height: 100%; background: linear-gradient(90deg, var(--coral), var(--sun)); transform-origin: left; }
  .iconcol { flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px; }
  .ib { width: 38px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); font-family: var(--pop); font-size: 11px; color: var(--ink2); }
  .ib svg { width: 16px; height: 16px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .bottom { bottom: 0; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; }
  #meter { padding: 6px 10px 8px; }
  .mhead { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; color: var(--ink2); margin-bottom: 5px; gap: 8px; }
  .mhead b { font-family: var(--mono); font-weight: 500; font-size: 12px; color: var(--ink); white-space: nowrap; }
  .track { position: relative; height: 6px; border-radius: 99px; background: rgba(246,241,232,.1); }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: linear-gradient(90deg, rgba(255,118,87,.5), var(--sun)); width: 0; }
  .band { position: absolute; top: 0; bottom: 0; border-radius: 99px; background: rgba(99,240,191,.35); box-shadow: inset 0 0 0 1.5px var(--mint); }
  .needle { position: absolute; top: -4px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 10px var(--sun); transition: left .08s linear, background .2s; }
  .needle.ok { background: var(--mint); box-shadow: 0 0 14px var(--mint); }
  .needle.bad { background: var(--rose); box-shadow: 0 0 12px var(--rose); }
  #meter.coarse .band, #meter.coarse .needle { display: none; }
  #meter:not(.coarse) .fill { display: none; }

  .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .lcol { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  #skipBtn { height: 38px; padding: 0 14px; border-radius: 12px; background: var(--ink); color: var(--void); font-family: var(--pop); font-size: 13px; white-space: nowrap; }
  #skipBtn:disabled { opacity: .35; }
  .warp { display: flex; align-items: center; border-radius: 12px; }
  .warp button { width: 34px; height: 32px; border-radius: 10px; font-size: 17px; font-family: var(--pop); }
  .warp button:active { background: rgba(246,241,232,.12); }
  #wVal { min-width: 58px; text-align: center; font-family: var(--mono); font-size: 11.5px; }
  #wVal.cap { color: var(--sun); }

  #burnBtn {
    width: 84px; height: 84px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 38% 32%, #ffa58c, var(--coral) 55%, #d9482c);
    box-shadow: 0 8px 24px rgba(255,118,87,.35), inset 0 -5px 10px rgba(0,0,0,.2);
    font-family: var(--pop); font-size: 16px; color: #2a0d05; line-height: 1.1;
    transition: transform .12s, filter .2s; touch-action: none;
  }
  #burnBtn small { display: block; font-family: var(--body); font-weight: 700; font-size: 9.5px; opacity: .75; }
  #burnBtn.retro { background: radial-gradient(circle at 38% 32%, #a8e2ff, var(--sky) 55%, #2a8fd0); box-shadow: 0 8px 24px rgba(95,196,255,.35), inset 0 -5px 10px rgba(0,0,0,.2); color: #04192a; }
  #burnBtn.on { transform: scale(.92); filter: brightness(1.2); }
  #burnBtn:disabled { filter: grayscale(1) brightness(.5); }
  .attn { animation: attn 1s ease-out infinite; }
  @keyframes attn { 0% { box-shadow: 0 0 0 0 rgba(255,211,122,.8); } 100% { box-shadow: 0 0 0 16px rgba(255,211,122,0); } }

  #corr { display: grid; grid-template-columns: repeat(2, 42px); gap: 5px; padding: 5px; border-radius: 14px; }
  #corr button { height: 34px; border-radius: 10px; background: rgba(246,241,232,.08); font-size: 11.5px; font-weight: 700; touch-action: none; }
  #corr button.on { background: var(--sky); color: #04192a; }
  #corr .t { grid-column: 1 / -1; font-size: 9px; text-align: center; color: var(--ink3); letter-spacing: .08em; }

  #pad { flex: 1; min-width: 0; max-width: 250px; padding: 6px; border-radius: 14px; display: flex; flex-direction: column; gap: 5px; }
  #padArea {
    position: relative; height: 64px; border-radius: 10px; touch-action: none;
    background:
      linear-gradient(rgba(246,241,232,.07) 1px, transparent 1px) 0 0/100% 12px,
      linear-gradient(90deg, rgba(246,241,232,.07) 1px, transparent 1px) 0 0/12px 100%,
      rgba(0,0,0,.25);
    overflow: hidden;
  }
  #padArea .knob { position: absolute; left: 50%; top: 50%; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 14px var(--sun); }
  #padArea .ax { position: absolute; font-size: 9px; color: var(--ink3); }
  #padVals { display: flex; justify-content: space-between; gap: 6px; font-family: var(--mono); font-size: 10.5px; color: var(--ink2); }
  #padVals b { color: var(--ink); font-weight: 500; }
  #execBtn { height: 34px; border-radius: 10px; background: var(--sun); color: #231704; font-family: var(--pop); font-size: 13px; }
  #execBtn:disabled { filter: grayscale(1) brightness(.55); }

  #toast {
    position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.8); opacity: 0;
    padding: 10px 18px; border-radius: 99px; background: var(--ink); color: var(--void);
    font-family: var(--pop); font-size: 16px; white-space: nowrap; pointer-events: none;
    transition: opacity .25s, transform .35s cubic-bezier(.2,1.6,.4,1);
  }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #slowTag { position: fixed; left: 50%; top: 56%; transform: translateX(-50%); font-family: var(--pop); font-size: 13px; letter-spacing: .5em; color: var(--sun); text-shadow: 0 0 14px rgba(255,211,122,.7); pointer-events: none; }

  #modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(4,5,10,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); padding: 16px; }
  .sheet { width: min(420px, 100%); max-height: 92%; overflow: auto; background: var(--glass2); border: 1px solid var(--line); border-radius: 24px; padding: 22px 20px 20px; box-sizing: border-box; }
  .logo { font-family: var(--pop); font-size: 40px; line-height: 1; letter-spacing: .04em; margin: 0; background: linear-gradient(100deg, var(--sun), var(--coral) 60%, var(--rose)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sheet h2 { font-family: var(--pop); font-weight: 400; font-size: 22px; margin: 0 0 6px; }
  .sheet p { font-size: 13.5px; line-height: 1.7; color: var(--ink2); margin: 8px 0; }
  .sheet .sub { font-family: var(--mono); font-size: 11px; color: var(--ink3); letter-spacing: .08em; margin-top: 6px; }
  .opts { display: grid; gap: 8px; margin-top: 14px; }
  .opt { text-align: left; padding: 12px 14px; border-radius: 15px; background: rgba(246,241,232,.07); border: 1px solid var(--line); }
  .opt b { font-family: var(--pop); font-weight: 400; font-size: 15px; display: block; }
  .opt span { font-size: 12px; color: var(--ink2); }
  .opt[aria-pressed="true"] { border-color: var(--sun); background: rgba(255,211,122,.12); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .go { margin-top: 16px; width: 100%; height: 52px; border-radius: 16px; background: var(--coral); color: #2a0d05; font-family: var(--pop); font-size: 18px; }
  .ghost { margin-top: 8px; width: 100%; height: 44px; border-radius: 14px; background: rgba(246,241,232,.08); font-weight: 700; }
  .stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; margin: 12px 0; }
  .stats dt { color: var(--ink2); }
  .stats dd { margin: 0; font-family: var(--mono); text-align: right; }
  .stars { font-size: 34px; letter-spacing: .1em; color: var(--sun); text-shadow: 0 0 18px rgba(255,211,122,.6); }
  .stars .off { color: rgba(246,241,232,.18); text-shadow: none; }
  .howto { margin: 10px 0 0; padding-left: 1.2em; font-size: 12.5px; line-height: 1.75; color: var(--ink2); }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; font-family: var(--mono); font-size: 12px; color: var(--ink3); pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .lbl.win i, .attn { animation: none; } #toast { transition: opacity .2s; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="boot">loading…</div>
<div id="labels"></div>

<div class="hud top">
  <section id="obj" class="card" aria-live="polite">
    <button id="objHead" aria-expanded="false"><span class="pill step" id="stepPill">1/5</span><span id="objTitle">月へ向けて加速</span><span class="pill" id="modePill">A</span><span class="chev">▼</span></button>
    <div id="next"><span id="nextTxt"></span><span id="cue"></span></div>
    <div id="more" hidden>
      <p id="objHint"></p>
      <div id="tele"></div>
    </div>
    <div id="fuelLine"><span id="fuelBar"></span></div>
  </section>
  <div class="iconcol">
    <button class="ib" id="viewBtn" aria-label="視点を切り替える">地球</button>
    <button class="ib" id="muteBtn" aria-label="音のオンオフ"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="muteWave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
    <button class="ib" id="menuBtn" aria-label="メニュー"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
  </div>
</div>

<div class="hud bottom">
  <section id="meter" class="card">
    <div class="mhead"><span id="mLabel">予測 近月点高度</span><b id="mValue">—</b></div>
    <div class="track"><div class="fill" id="mFill"></div><div class="band" id="mBand"></div><div class="needle" id="mNeedle"></div></div>
  </section>
  <div class="row">
    <div class="lcol">
      <button id="skipBtn">▶▶ 次へ</button>
      <div class="warp card">
        <button id="wDown" aria-label="時間を遅く">−</button>
        <span id="wVal">×1</span>
        <button id="wUp" aria-label="時間を速く">+</button>
      </div>
    </div>
    <button id="burnBtn">噴射<small>長押し</small></button>
    <section id="pad" class="card" hidden>
      <div id="padArea"><span class="ax" style="left:6px;top:4px">↑ Δv多く</span><span class="ax" style="right:6px;bottom:4px">→ 遅く点火</span><div class="knob" id="knob"></div></div>
      <div id="padVals"><span>Δv <b id="pDv">—</b></span><span>点火 <b id="pT">—</b></span></div>
      <button id="execBtn">この計画で噴射</button>
    </section>
    <section id="corr" class="card" hidden>
      <span class="t">修正噴射</span>
      <button data-d="pro">前</button><button data-d="retro">後</button>
      <button data-d="out">外</button><button data-d="in">内</button>
    </section>
  </div>
</div>

<div id="toast"></div>
<div id="slowTag" hidden>SLOW</div>
<div id="modal"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

// ==PHYSICS==  (km, s; Earth-centred, orbit plane only)
const RE = 6371, RM = 1737.4, MUE = 398600.4, MUM = 4902.8, DM = 384400;
const WM = Math.sqrt((MUE + MUM) / DM ** 3);
const SOI = 66100, ATM = 120, BETA = 350, LD = 0.3, G0 = 0.00981;
const IM3 = 1 / DM ** 3;

// Earth is held fixed, so the indirect term keeps the frame honest.
function accel(x, y, vx, vy, t, th0, tx, ty, o) {
  const a = th0 + WM * t, mx = DM * Math.cos(a), my = DM * Math.sin(a);
  const r2 = x * x + y * y, r = Math.sqrt(r2), ir3 = 1 / (r2 * r);
  const dx = x - mx, dy = y - my, d2 = dx * dx + dy * dy, id3 = 1 / (d2 * Math.sqrt(d2));
  let ax = -MUE * x * ir3 - MUM * (dx * id3 + mx * IM3) + tx;
  let ay = -MUE * y * ir3 - MUM * (dy * id3 + my * IM3) + ty;
  let aero = 0;
  const alt = r - RE;
  if (alt < ATM) {
    const v = Math.hypot(vx, vy) || 1e-9;
    const rho = 1.225 * Math.exp(-Math.max(alt, 0) / 7.2);
    aero = rho * (v * 1000) ** 2 / (2 * BETA) / 1000;
    // Lift down while climbing so a shallow pass bites instead of skipping; up while falling to soften the peak.
    const vr = (x * vx + y * vy) / r;
    let lx = -vy / v, ly = vx / v;
    if (lx * x + ly * y < 0) { lx = -lx; ly = -ly; }
    const s = vr > 0 ? -1 : 1;
    ax += -aero * vx / v + LD * aero * lx * s;
    ay += -aero * vy / v + LD * aero * ly * s;
    aero *= Math.sqrt(1 + LD * LD);
  }
  o[0] = ax; o[1] = ay; o[2] = aero;
}

const _k = new Float64Array(3);
function rk4(s, t, h, th0, tx, ty) {
  const x = s[0], y = s[1], vx = s[2], vy = s[3];
  accel(x, y, vx, vy, t, th0, tx, ty, _k); const a1x = _k[0], a1y = _k[1], g = _k[2];
  const x2 = x + vx * h / 2, y2 = y + vy * h / 2, vx2 = vx + a1x * h / 2, vy2 = vy + a1y * h / 2;
  accel(x2, y2, vx2, vy2, t + h / 2, th0, tx, ty, _k); const a2x = _k[0], a2y = _k[1];
  const x3 = x + vx2 * h / 2, y3 = y + vy2 * h / 2, vx3 = vx + a2x * h / 2, vy3 = vy + a2y * h / 2;
  accel(x3, y3, vx3, vy3, t + h / 2, th0, tx, ty, _k); const a3x = _k[0], a3y = _k[1];
  const x4 = x + vx3 * h, y4 = y + vy3 * h, vx4 = vx + a3x * h, vy4 = vy + a3y * h;
  accel(x4, y4, vx4, vy4, t + h, th0, tx, ty, _k); const a4x = _k[0], a4y = _k[1];
  s[0] = x + h / 6 * (vx + 2 * vx2 + 2 * vx3 + vx4);
  s[1] = y + h / 6 * (vy + 2 * vy2 + 2 * vy3 + vy4);
  s[2] = vx + h / 6 * (a1x + 2 * a2x + 2 * a3x + a4x);
  s[3] = vy + h / 6 * (a1y + 2 * a2y + 2 * a3y + a4y);
  return g;
}

function moonAt(t, th0) {
  const a = th0 + WM * t;
  return [DM * Math.cos(a), DM * Math.sin(a), -DM * WM * Math.sin(a), DM * WM * Math.cos(a)];
}

// Step follows the local dynamical time of whichever body dominates.
function stepSize(s, t, th0, k, burning, hAtm = 0.25) {
  const m = moonAt(t, th0);
  const rE = Math.hypot(s[0], s[1]), rM = Math.hypot(s[0] - m[0], s[1] - m[1]);
  let h = k * Math.min(Math.sqrt(rE ** 3 / MUE), Math.sqrt(rM ** 3 / MUM));
  const alt = rE - RE;
  if (alt < 150) h = Math.min(h, alt < ATM ? hAtm : 4);
  if (burning) h = Math.min(h, 0.2);
  return Math.max(h, 0.05);
}

function elements(rx, ry, vx, vy, mu) {
  const r = Math.hypot(rx, ry), v2 = vx * vx + vy * vy;
  const en = v2 / 2 - mu / r, h = rx * vy - ry * vx;
  const a = -mu / (2 * en);

  if (mainAvailable()) return S.mode === 'B' ? ['パッドを上下に引いて針を緑へ → 噴射', 'pad'] : ['▶▶ で点火地点◎まで進める', 'skip'];
  const mt = metric(pred);
  if (st === 'coast') return mt.ok ? ['▶▶ で月まで進める（約4日）', 'skip'] : ['修正噴射で針を緑へ（小刻みに）', 'corr'];
  if (st === 'loi') return ['修正噴射『後』で月に捕まる', 'corr'];
  if (st === 'tei') return mt.ok || !mt.band ? ['▶▶ で月を離れる', 'skip'] : ['修正噴射で針を緑へ', 'corr'];
  if (st === 'ret') return mt.ok ? ['▶▶ で地球まで進める', 'skip'] : ['修正噴射『外』『内』で針を緑へ', 'corr'];
  if (st === 'entry') return [`再突入中… ${S.g.toFixed(1)} G`, 'none'];
  return ['', 'none'];
}
function updateHUD(w) {
  const st = STAGES[S.stage];
  ui.step.textContent = `${st.n}/5`;
  ui.title.textContent = st.title;
  if (!ui.more.hidden) ui.hint.textContent = hint();
  const au = S.auto;
  if (au && !au.firing && au.tIgn - S.t > 20) { const w2 = windowInfo(); if (w2) au.tIgn = Math.max(S.t + 1, w2.t + au.shift); }

  const [txt, target] = nextAction();
  ui.nextTxt.textContent = txt;
  ui.next.classList.toggle('now', S.holding || (S.burn && S.burn.kind === 'main' && S.slow));
  ui.next.classList.toggle('act', target !== 'none');
  let cue = '';
  if (au && !au.firing) cue = `点火まで ${fmtDur(au.tIgn - S.t)}`;
  else if (au && au.firing) cue = `${Math.round(au.done * 1000)}/${Math.round(au.dv * 1000)} m/s`;
  else if (!S.holding && mainAvailable() && !S.burn) { const wi = windowInfo(); if (wi) cue = `◎まで ${fmtDur(wi.t - S.t)}`; }
  else if (!S.holding && !mainAvailable()) { const t = nextEvent(); if (t !== null) cue = `あと ${fmtDur(t - S.t)}`; }
  ui.cue.textContent = cue;
  for (const [el, k] of [[ui.burn, 'burn'], [ui.skip, 'skip'], [ui.corr, 'corr'], [ui.exec, 'pad']]) el.classList.toggle('attn', target === k);
  if (S.holding && !S._heldAlert) { S._heldAlert = true; sfx.alert(); }
  if (!S.holding) S._heldAlert = false;
  ui.skip.disabled = S.holding || !!S.burn || S.stage === 'entry' || nextEvent() === null;
  ui.skip.textContent = S.skip ? '▶▶ 進行中' : '▶▶ 次へ';

  if (!ui.more.hidden) {
    const d = dominant(S.s, S.t);
    const el = elements(d.rx, d.ry, d.vx, d.vy, d.mu);
    const alt = d.r - d.R, v = Math.hypot(d.vx, d.vy);
    ui.tele.innerHTML = `<div>時刻<b>${fmtMET(S.t).slice(3)}</b></div><div>基準<b>${d.moon ? '月' : '地球'}</b></div>
      <div>高度<b>${fmtKm(alt)}</b></div><div>速度<b>${v.toFixed(3)}</b></div>
      <div>${d.moon ? '近月点' : '近地点'}<b>${fmtKm(el.rp - d.R)}</b></div><div>${d.moon ? '遠月点' : '遠地点'}<b>${el.en < 0 ? fmtKm(el.ra - d.R) : '脱出'}</b></div>
      <div>残りΔv<b>${Math.round(S.fuel * 1000).toLocaleString('ja-JP')}</b></div><div>G<b>${S.g.toFixed(1)}</b></div>`;
  }
  ui.fuelBar.style.transform = `scaleX(${S.fuel / FUEL0})`;
  ui.wVal.textContent = S.holding ? '停止中' : S.slow ? 'スロー' : '×' + (w.eff >= 1 ? Math.round(w.eff).toLocaleString('ja-JP') : w.eff.toFixed(2));
  ui.wVal.classList.toggle('cap', w.capped || S.slow || S.holding || S.skip);

  const src = S.mode === 'B' && S.plan && !S.auto ? plan : pred;
  const mt = metric(src);
  // While the main burn is far from the target, show how much has been burned against the rough need, so progress is visible.
  const coarse = S.burn && S.burn.kind === 'main' && !S.slow && !mt.ok;
  ui.meter.classList.toggle('coarse', !!coarse);
  if (coarse) {
    // No target mark here: the stopping point only appears once the precision meter takes over.
    const b = S.burn, f = Math.min(0.96, b.done / b.nom);
    ui.mLabel.textContent = '押し続ける';
    ui.mValue.textContent = `噴射量 ${Math.round(b.done * 1000).toLocaleString('ja-JP')} m/s`;
    ui.mFill.style.width = (f * 100) + '%';
  } else {
    ui.mLabel.textContent = (src === plan ? '計画 ' : '') + mt.lab;
    ui.mValue.textContent = mt.val;
    if (mt.band) {
      const lo = scalePos(mt.scale, mt.band.lo), hi = scalePos(mt.scale, mt.band.hi);
      ui.mBand.style.left = (lo * 100) + '%'; ui.mBand.style.width = Math.max(1.5, (hi - lo) * 100) + '%';
    }
    ui.mNeedle.style.left = (mt.pos * 100) + '%';
    ui.mNeedle.classList.toggle('ok', !!mt.ok); ui.mNeedle.classList.toggle('bad', !!mt.bad);
  }
  if (mt.ok && !S._wasOk && (S.burn || S.auto)) sfx.ok();
  S._wasOk = !!mt.ok;

  // Controls per stage and mode.
  const hasMain = !!STAGES[S.stage].dir && !S.main[S.stage] && (S.stage !== 'tei' || S.captured);
  ui.burn.hidden = !(S.mode === 'A' && hasMain);
  ui.burn.disabled = !mainAvailable();
  const dir = STAGES[S.stage].dir;
  ui.burn.classList.toggle('retro', dir === 'retro');
  ui.burn.firstChild.textContent = dir === 'retro' ? '減速' : '噴射';
  ui.pad.hidden = !(S.mode === 'B' && hasMain);
  ui.corr.hidden = hasMain || S.stage === 'entry';
  if (!ui.pad.hidden) {
    if (!S.plan && !S.auto) { S.plan = defaultPlan(); planDirty = true; }
    const p = S.plan;
    // Keep the plan pinned to the refined window until it is executed.
    if (p && !S.auto) { const w2 = windowInfo(); if (w2 && Math.abs(w2.t - p.base) > 0.5) { p.base = w2.t; planDirty = true; } }
    if (p) {
      ui.pDv.textContent = Math.round((p.dv0 + p.ddv) * 1000).toLocaleString('ja-JP') + ' m/s';
      const tI = p.base + p.shift - S.t;
      ui.pT.textContent = (tI >= 0 ? 'あと' : '') + fmtDur(tI) + (p.shift ? ` (${p.shift > 0 ? '+' : '−'}${Math.round(Math.abs(p.shift))}秒)` : '');
      const kx = Math.max(-1, Math.min(1, p.shift / 1800)), ky = Math.max(-1, Math.min(1, p.ddv / (p.dv0 * 0.5)));
      const aw = ui.padArea.clientWidth / 2 - 18, ah = ui.padArea.clientHeight / 2 - 18;
      ui.knob.style.transform = `translate(${kx * aw}px, ${-Math.sign(ky) * Math.sqrt(Math.abs(ky)) * ah}px)`;
    }
    ui.exec.disabled = !!S.auto || !p;
    ui.exec.textContent = S.auto ? (S.auto.firing ? '噴射中…' : '点火待ち…') : 'この計画で噴射';
  }
}

// ---------- frame ----------
let last = performance.now(), frameN = 0, fpsAcc = 0, fpsN = 0;
const shipQ = new THREE.Quaternion(), upY = new THREE.Vector3(0, 1, 0), dirV = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  const dtR = Math.min(0.1, (now - last) / 1000); last = now; frameN++;
  fpsAcc += dtR; fpsN++;
  if (fpsAcc > 2.5) { const fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; if (fps < 40 && DPR > 1) { DPR = Math.max(1, DPR - 0.35); resize(); } }

  const b0 = currentBurn();
  const w = effWarp(b0);
  S.holding = false;
  if (!S.paused && S.started && !S.over) {
    let dtSim = dtR * w.eff;
    const gap = holdGap();
    if (gap !== null) { if (gap <= 0.05) { dtSim = 0; if (!S.holding) { S.skip = false; } S.holding = true; } else dtSim = Math.min(dtSim, gap); }
    if (S.skip && (S.t >= S.skipT - 0.5 || nextEvent() === null)) S.skip = false;
    if (dtSim > 0) advance(dtSim);
    stageLogic();
    const rE = Math.hypot(S.s[0], S.s[1]);
    const d = dominant(S.s, S.t);
    const trailDt = Math.max(2, Math.min(900, 2 * Math.PI * Math.sqrt(d.r ** 3 / d.mu) / 400));
    if (S.t - lastTrailT > trailDt) { trail.push([S.s[0], S.s[1], S.t]); lastTrailT = S.t; if (trail.length > 5000) trail.splice(0, 1000); }
  }
  const b = currentBurn();
  if (b || S.auto) predDirty = true;
  if ((predDirty && (b ? true : frameN % 3 === 0)) || frameN % 20 === 0) { runPredict(); if (b) updateBurnSlope(); }
  if (frameN % 20 === 0) planDirty = true;
  if (S.burn && S.burn.kind === 'main' && S.slow && !S._fine) { S._fine = true; toast('あと少し！ 緑で離す', 1400); }
  const planning = S.mode === 'B' && S.plan && !S.auto && mainAvailable();
  if (planDirty && planning) { runPlan(); buildPredLine(plan, planLine, true); }
  if (!planning) planLine.visible = false;
  predLine.material.opacity = planning ? 0.3 : 1;
  if (frameN % 8 === 0) buildTrail();

  // Positions.
  const m = moonAt(S.t, S.th0);
  const mc = moonCenter(m);
  moonPos.set(mc[0], 0, -mc[1]);
  moon.position.copy(moonPos);
  moon.rotation.y = S.th0 + WM * S.t;
  moonMat.uniforms.uEarth.value.copy(moonPos).negate().normalize();
  soiRing.position.copy(moonPos);
  toV3(S.s[0], S.s[1], m[0], m[1], shipPos);
  earth.rotation.y = S.t * 7.292e-5 + 1.2;
  earthMat.uniforms.uTime.value = S.t / 60;
  for (const l of [predLine, trailLine, planLine]) { if (l.userData.mf) l.position.copy(moonPos); else l.position.set(0, 0, 0); }

  // Camera.
  cam.off.multiplyScalar(Math.exp(-dtR * 3.5));
  focusPos(cam.focus, cam.target).add(cam.off);
  cam.dist += (cam.distT - cam.dist) * (1 - Math.exp(-dtR * 6));
  camera.position.set(Math.cos(cam.el) * Math.sin(cam.az), Math.sin(cam.el), Math.cos(cam.el) * Math.cos(cam.az)).multiplyScalar(cam.dist).add(cam.target);
  for (const [c, r] of [[new THREE.Vector3(), R_EARTH], [moonPos, R_MOON]]) {
    const dv = camera.position.clone().sub(c), L = dv.length();
    if (L < r * 1.01 + 0.02) camera.position.copy(c).addScaledVector(dv.normalize(), r * 1.01 + 0.02);
  }
  camera.near = Math.min(2, Math.max(0.002, cam.dist * 0.004));
  camera.lookAt(cam.target); camera.updateProjectionMatrix();
  bgCam.quaternion.copy(camera.quaternion);

  // Ship.
  const sd = camera.position.distanceTo(shipPos);
  ship.position.copy(shipPos);
  ship.scale.setScalar(sd * 0.009);
  const d = dominant(S.s, S.t);
  const inEntry = S.stage === 'entry';
  let dirSim;
  if (b) { thrustVec(b.dir, S.s, S.t, 1, _tv); dirSim = [_tv[0], _tv[1]]; }
  else { const v = Math.hypot(d.vx, d.vy) || 1; dirSim = inEntry ? [-S.s[2], -S.s[3]] : [d.vx / v, d.vy / v]; }
  dirV.set(dirSim[0], 0, -dirSim[1]).normalize();
  shipQ.setFromUnitVectors(upY, dirV);
  ship.quaternion.slerp(shipQ, 1 - Math.exp(-dtR * 5));
  for (const o of shipBody.userData.sm) o.visible = !inEntry;
  flameMat.uniforms.uT.value = now / 1000;
  flameMat.uniforms.uI.value += ((b ? (b.kind === 'main' ? 1 : 0.35) : 0) - flameMat.uniforms.uI.value) * 0.3;
  flame.scale.set(1, b && b.kind === 'corr' ? 0.4 : 1, 1);
  flame.visible = flameMat.uniforms.uI.value > 0.01;
  plasmaMat.uniforms.uT.value = now / 1000;
  plasmaMat.uniforms.uI.value = inEntry ? Math.min(1.4, S.g / 5) : 0;
  plasma.visible = inEntry && S.g > 0.05;
  // Earth's shadow on the ship (a cylinder behind Earth along the sunlight).
  const sp = new THREE.Vector3(S.s[0], 0, -S.s[1]), along = sp.dot(SUN);
  const inShadow = along < 0 && sp.clone().addScaledVector(SUN, -along).length() < RE;
  sunLight.intensity += ((inShadow ? 0.02 : 3.2) - sunLight.intensity) * 0.2;
  sunLight.position.copy(shipPos).addScaledVector(SUN, 10); sunLight.target.position.copy(shipPos);

  // Labels.
  let li = 0;
  const eScr = R_EARTH / camera.position.length(), mScr = R_MOON / camera.position.distanceTo(moonPos);
  const scrUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
  if (eScr < 0.35) place(label(li++, 'body'), tmpV.set(0, 0, 0).addScaledVector(scrUp, R_EARTH * 1.3), '地球');
  if (mScr < 0.35) place(label(li++, 'body'), tmpV.copy(moonPos).addScaledVector(scrUp, R_MOON * 1.45), '月');
  const mf = frameMoon(), mNow = m;
  const evPos = (x, y, t) => {
    if (mf) { const mm = moonAt(t, S.th0); return toV3(x - mm[0] + mNow[0], y - mm[1] + mNow[1], mNow[0], mNow[1], new THREE.Vector3()); }
    const mm = moonAt(t, S.th0); return toV3(x, y, mm[0], mm[1], new THREE.Vector3());
  };
  const wiL = mainAvailable() && S.mode === 'A' && !S.burn ? windowInfo() : null;
  if (wiL) place(label(li++, 'win'), evPos(wiL.x, wiL.y, wiL.mt || wiL.t), '点火');
  const src = S.mode === 'B' && S.plan && !S.auto ? plan : pred;
  const seen = {};
  for (const e of src.events) {
    if (seen[e.k]) continue; seen[e.k] = 1;
    const txt = { ca: `最接近 ${fmtKm(e.alt)}`, pm: `近月点 ${fmtKm(e.alt)}`, pe: `近地点 ${fmtKm(e.alt)}`, entry: '大気圏突入', splash: '着水', skip: 'スキップ', crash: '衝突！' }[e.k];
    const color = { ca: '#9fb4d8', pm: '#63f0bf', pe: '#ffd37a', entry: '#ff9d6b', splash: '#5fc4ff', skip: '#ff5c8a', crash: '#ff5c8a' }[e.k];
    if (txt) place(label(li++), evPos(e.x, e.y, e.t), txt, color);
  }
  if (S.mode === 'B' && S.plan && plan.burnIdx >= 0 && !S.auto) { const k = plan.burnIdx; place(label(li++, 'win'), evPos(plan.x[k], plan.y[k], plan.t[k]), '点火'); }
  for (let i = li; i < labelPool.length; i++) labelPool[i].hidden = true;

  // Post and audio.
  const slowT = S.slow ? 1 : 0;
  finalPass.uniforms.uSlow.value += (slowT - finalPass.uniforms.uSlow.value) * 0.12;
  finalPass.uniforms.uTime.value = (now / 1000) % 100;
  ui.slow.hidden = !S.slow;
  sfx.update(b ? b.kind : null, S.slow, inEntry ? S.g : 0);

  if (now - hudT > 90) { hudT = now; updateHUD(w); }
  composer.render();
}

// ---------- boot ----------
resize();
load(initialState());
S.started = false;
openStart();
applyMode();
$('boot').remove();
requestAnimationFrame(frame);
window.__S = S; window.__pred = pred; window.__autopilot = () => autopilot(); window.__load = load; window.__step = (dt) => { advance(dt); stageLogic(); runPredict(); }; window.__metric = () => metric(pred); window.__win = () => windowInfo(); window.__frame = () => { const b = currentBurn(); const w = effWarp(b); advance(w.eff / 60); stageLogic(); runPredict(); if (currentBurn()) updateBurnSlope(); return w.eff; }; window.__sim = (sec) => { let f = 0, slowF = 0; const n = Math.round(sec * 60); for (let i = 0; i < n; i++) { const b = currentBurn(); const w = effWarp(b); advance(w.eff / 60); stageLogic(); runPredict(); if (currentBurn()) updateBurnSlope(); if (S.slow) slowF++; f++; if (!S.burn) break; } return slowF / 60; }; window.__planMetric = () => { const w2 = windowInfo(); if (w2 && S.plan) S.plan.base = w2.t; runPlan(); return metric(plan); }; window.__hud = () => updateHUD(effWarp(null)); window.__defaultPlan = defaultPlan; window.__endBurn = endMainBurn; window.__dbg = { predLine, trailLine, atmosphere, earth, cam, setFocus };
</script>
